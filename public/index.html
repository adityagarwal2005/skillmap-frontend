<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="google-site-verification" content="dLCNQ2_xlSy3fsXUpstNW5tVnpup1qNJ6E7xeC4yFKA" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta
      name="description"
      content="Find skilled people on your campus. Post freelance jobs, start collabs, and get work done with people right around you."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DoitHere" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Link previews (Open Graph) — how the site looks when shared in
         Instagram DMs / WhatsApp / etc. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DoitHere" />
    <meta property="og:title" content="DoitHere — Campus Talent Network" />
    <meta property="og:description" content="Find skilled people on your campus. Collaborate, freelance, and get work done." />
    <meta property="og:url" content="https://doithere.in/" />
    <meta property="og:image" content="https://doithere.in/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DoitHere — Campus Talent Network" />
    <meta name="twitter:description" content="Find skilled people on your campus. Collaborate, freelance, and get work done." />
    <meta name="twitter:image" content="https://doithere.in/og-image.png" />

    <title>DoitHere — Campus Talent Network</title>

    <!-- Structured data — tells Google what the site/brand actually is,
         which is what makes a proper title + logo (instead of a bare URL)
         show up in search results. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "DoitHere",
        "url": "https://doithere.in/",
        "logo": "https://doithere.in/icon-512.png",
        "description": "DoitHere is a campus talent network — find skilled people nearby, post and apply to freelance work, and team up on collabs."
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "DoitHere",
        "url": "https://doithere.in/"
      }
    </script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
